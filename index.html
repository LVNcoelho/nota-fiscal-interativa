<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha de Vendas - T 7 Carnes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-shadow { box-shadow: none !important; border: none !important; }
            .print-border { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <main class="max-w-5xl w-full mx-auto p-4 my-4">
        <div class="bg-white rounded-xl shadow-md border border-slate-200 p-8 print-border">
            
            <!-- CABEÇALHO DO EMISSOR -->
            <div class="border-b-2 border-slate-200 pb-6 mb-6 text-center">
                <input type="text" value="T 7 COMÉRCIO DE CARNES LTDA" class="text-2xl font-extrabold text-slate-900 text-center w-full focus:outline-none">
                <input type="text" value="MERCADAO N 1" class="text-sm font-semibold text-amber-600 text-center w-full focus:outline-none uppercase mt-1">
            </div>

            <!-- METADADOS -->
            <div class="bg-slate-50 p-4 rounded-lg mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-500 w-20 uppercase">Cliente:</span>
                        <input type="text" placeholder="Nome do Cliente" class="text-sm font-semibold text-slate-800 w-full bg-transparent focus:outline-none">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-500 w-20 uppercase">Endereço:</span>
                        <input type="text" value="RUA XI, 44 FONTE BOA - CASTANHAL" class="text-sm text-slate-700 w-full bg-transparent focus:outline-none">
                    </div>
                </div>
                <div class="flex items-center justify-end">
                    <span class="text-xs font-bold text-slate-500 uppercase mr-2">Data:</span>
                    <input type="text" value="28/05/2026" class="text-sm font-mono font-bold text-slate-800 w-28 bg-transparent focus:outline-none">
                </div>
            </div>

            <!-- TABELA -->
            <table class="w-full text-left border-collapse" id="tabela-itens">
                <thead>
                    <tr class="bg-slate-800 text-white text-xs uppercase font-mono">
                        <th class="py-3 px-4 text-center w-24">Quant.</th>
                        <th class="py-3 px-4">Discriminação</th>
                        <th class="py-3 px-4 text-right">P. Unitário</th>
                        <th class="py-3 px-4 text-right">Total</th>
                        <th class="py-3 px-2 text-center no-print">Ação</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <tr>
                        <td class="p-2 text-center"><input type="number" value="1000" oninput="calcularLinha(this)" class="w-full text-center font-mono focus:outline-none"></td>
                        <td class="p-2"><input type="text" value="Acendedor de carvão" class="w-full focus:outline-none"></td>
                        <td class="p-2 text-right"><input type="number" step="0.01" value="0.75" oninput="calcularLinha(this)" class="w-full text-right font-mono focus:outline-none"></td>
                        <td class="p-2 text-right font-mono total-linha">R$ 750,00</td>
                        <td class="p-2 text-center no-print"><button onclick="removerLinha(this)" class="text-rose-600">X</button></td>
                    </tr>
                </tbody>
            </table>

            <div class="mt-6 flex justify-end">
                <div class="bg-indigo-950 text-white rounded-lg p-4 w-64 text-right">
                    <span class="text-xs text-amber-400 font-bold uppercase">Total Geral</span>
                    <div class="text-2xl font-extrabold text-amber-300" id="total-geral">R$ 750,00</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function formatarMoeda(valor) { return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function calcularLinha(input) {
            const tr = input.closest('tr');
            const q = parseFloat(tr.querySelector('td:nth-child(1) input').value) || 0;
            const p = parseFloat(tr.querySelector('td:nth-child(3) input').value) || 0;
            tr.querySelector('.total-linha').textContent = formatarMoeda(q * p);
            calcularGeral();
        }
        function calcularGeral() {
            let total = 0;
            document.querySelectorAll('#corpo-tabela tr').forEach(tr => {
                const q = parseFloat(tr.querySelector('td:nth-child(1) input').value) || 0;
                const p = parseFloat(tr.querySelector('td:nth-child(3) input').value) || 0;
                total += (q * p);
            });
            document.getElementById('total-geral').textContent = formatarMoeda(total);
        }
        function removerLinha(btn) { btn.closest('tr').remove(); calcularGeral(); }
    </script>
</body>
</html>
